services:
  - type: web
    name: gridwise-llm
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOG_LEVEL
        value: INFO
      - key: KEEPALIVE_URL
        value: https://gridwise-llm-vby1.onrender.com/health
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "600"

services:
  - type: web
    name: gridwise-llm
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOG_LEVEL
        value: INFO
      - key: KEEPALIVE_URL
        value: https://gridwise-llm-vby1.onrender.com/health
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "600"
      # Model identifiers are not secrets and live in version control.
      # Override only if a model is retired.
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite,gemini-3.6-flash
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
      # Keys are set in the Render dashboard only. sync:false keeps any value
      # out of this file and out of git. One key per provider: the code decides
      # the order, so there is no primary/fallback slot to put a key into
      # wrongly.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

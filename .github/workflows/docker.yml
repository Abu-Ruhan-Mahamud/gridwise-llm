name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gridwise-llm:latest
            ghcr.io/${{ github.repository_owner }}/gridwise-llm:${{ github.sha }}

      - name: Print the exact digest for the README
        run: echo "ghcr.io/${{ github.repository_owner }}/gridwise-llm@${{ steps.build.outputs.digest }}"

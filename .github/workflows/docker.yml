name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects any uppercase in a repository name, and GitHub usernames
      # may contain capitals, so the owner is lowercased before it is used.
      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/gridwise-llm:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/gridwise-llm:${{ github.sha }}

      - name: Print the exact digest for the README
        run: |
          echo "### Docker image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ steps.vars.outputs.owner }}/gridwise-llm:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ steps.vars.outputs.owner }}/gridwise-llm@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ steps.vars.outputs.owner }}/gridwise-llm@${{ steps.build.outputs.digest }}"
